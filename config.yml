# The text shown above the hotbar. Edit it here, or in-game with: /servertext set <text>
# Run /servertext reload after editing this file.
#
# Colors/formatting use MiniMessage: https://docs.advntr.dev/minimessage/format.html
#   <red> <gold> <gray> <white> <bold> <#ff55aa> <gradient:red:blue>text</gradient>
